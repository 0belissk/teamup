name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -d backend
          test -d frontend
          test -d docs
          test -f README.md
          test -f .gitignore
